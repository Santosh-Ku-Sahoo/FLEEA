# FLEEA — Render Blueprint
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Defines the infrastructure for deploying FLEEA on Render.
# Render auto-syncs this file on every push to master.

services:
  - type: web
    name: fleea
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install flask flask-socketio gunicorn gevent gevent-websocket eventlet google-genai httpx pydantic pydantic-settings python-dotenv rich tenacity chromadb sentence-transformers bcrypt numpy
      pip install faster-whisper sounddevice pyttsx3 || echo "Voice deps skipped (expected on cloud)"
      cd web && npm install && npm run build
    startCommand: gunicorn --worker-class gevent -w 1 --bind 0.0.0.0:$PORT interfaces.voice_ui_server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: NODE_VERSION
        value: "20"
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: "/data/fleea.db"
    disk:
      name: fleea-data
      mountPath: /data
      sizeGB: 1
